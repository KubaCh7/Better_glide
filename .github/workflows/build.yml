name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 26 image: Xcode 26 SDK (Liquid Glass APIs) and a recent OS for the MultitouchSupport check.
    runs-on: macos-26
    # Needed to publish the DMG as a GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build SwipeProbe
        run: xcodebuild -project BetterGlide.xcodeproj -scheme SwipeProbe -configuration Debug -derivedDataPath build -quiet build

      - name: Verify MultitouchSupport loads on this macOS
        run: build/Build/Products/Debug/SwipeProbe --check

      - name: Unit tests
        run: xcodebuild -project BetterGlide.xcodeproj -scheme BetterGlide -configuration Debug -derivedDataPath build -destination 'platform=macOS' -quiet test

      - name: Build BetterGlide (Release, universal)
        run: >
          xcodebuild -project BetterGlide.xcodeproj -scheme BetterGlide -configuration Release
          -derivedDataPath build -destination 'generic/platform=macOS' -quiet
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          build

      # With the SIGNING_CERT_* secrets (scripts/create-signing-certificate.sh) builds keep the
      # same identity, so macOS keeps Accessibility/Screen Recording across in-app updates.
      - name: Sign
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/BetterGlide.app
          if [ -n "$SIGNING_CERT_P12" ]; then
            scripts/sign-app.sh "$APP"
          else
            echo "::warning::No SIGNING_CERT_P12 secret: release stays ad-hoc signed, so permissions reset after each update."
            # Self-test of the signing pipeline with a throwaway certificate on a copy of the app.
            scripts/create-signing-certificate.sh --local-only "$RUNNER_TEMP/test-cert"
            cp -R "$APP" "$RUNNER_TEMP/SignTest.app"
            SIGNING_CERT_P12="$(cat "$RUNNER_TEMP/test-cert/cert.p12.base64")" \
            SIGNING_CERT_PASSWORD="$(cat "$RUNNER_TEMP/test-cert/password.txt")" \
              scripts/sign-app.sh "$RUNNER_TEMP/SignTest.app"
          fi

      - name: Package DMG
        run: |
          mkdir -p dist
          scripts/make-dmg.sh build/Build/Products/Release/BetterGlide.app dist/BetterGlide.dmg
          cp build/Build/Products/Debug/SwipeProbe dist/SwipeProbe
          lipo -info build/Build/Products/Release/BetterGlide.app/Contents/MacOS/BetterGlide
          codesign --verify --verbose build/Build/Products/Release/BetterGlide.app

      - uses: actions/upload-artifact@v4
        with:
          name: BetterGlide-${{ github.sha }}
          path: dist/

      # The in-app updater reads this release: keep the "BetterGlide (build N)" title format.
      # Every push to a branch (not pull requests) replaces the "latest-build" release,
      # so the download link below always points to the newest DMG:
      # https://github.com/<owner>/<repo>/releases/latest/download/BetterGlide.dmg
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build dist/BetterGlide.dmg \
            --target "$GITHUB_SHA" \
            --title "BetterGlide (build ${{ github.run_number }})" \
            --latest \
            --notes "**Co nowego:** $(git log -1 --format=%s)

          Automatyczny build z gałęzi \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA::7}. Jeśli masz już BetterGlide, zaktualizujesz go z menu: *Sprawdź aktualizacje…*

          **Instalacja:** otwórz BetterGlide.dmg i przeciągnij BetterGlide do folderu Aplikacje.

          Aplikacja nie jest jeszcze notaryzowana przez Apple, więc przy pierwszym uruchomieniu wykonaj w Terminalu:
          \`\`\`
          xattr -dr com.apple.quarantine /Applications/BetterGlide.app
          \`\`\`
          (albo: Ustawienia systemowe → Prywatność i ochrona → „Otwórz mimo to”)."
