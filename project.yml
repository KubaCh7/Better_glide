# XcodeGen spec — run `xcodegen generate` (or `make project`) to create BetterGlide.xcodeproj.
name: BetterGlide
options:
  bundleIdPrefix: com.betterglide
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing; Developer ID signing + notarization is a later step (see README).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  BetterGlide:
    type: application
    platform: macOS
    sources:
      - path: BetterGlide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterglide.BetterGlide
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # No App Sandbox: Accessibility control of other apps and private
        # MultitouchSupport are not allowed in the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - BetterGlideTests
  SwipeProbe:
    type: tool
    platform: macOS
    sources:
      - path: SwipeProbe
      - path: BetterGlide/Gesture/MultitouchBridge.swift
      - path: BetterGlide/Gesture/SwipeDetector.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterglide.SwipeProbe
    scheme: {}
  BetterGlideTests:
    type: bundle.unit-test
    platform: macOS
    # Logic-only tests: the pure source files are compiled straight into the
    # test bundle, so the menu bar app is never launched as a test host.
    sources:
      - path: BetterGlideTests
      - path: BetterGlide/Gesture/SwipeDetector.swift
      - path: BetterGlide/Windows/WindowOrdering.swift
      - path: BetterGlide/Layout/LayoutStore.swift
      - path: BetterGlide/Layout/DisplayConfiguration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterglide.BetterGlideTests
        GENERATE_INFOPLIST_FILE: YES
